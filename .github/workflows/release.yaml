name: Release
# Hängt die Komponente als Zip ans Release. Notwendig, damit HACS das Asset lädt
# statt des Source-Zipballs — nur so sind Installationszahlen überhaupt messbar
# (Zipball-Downloads zählt die GitHub-API nicht).
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Komponente zippen
        run: cd custom_components/device_saver && zip -r "$GITHUB_WORKSPACE/device_saver.zip" .
      - name: Ans Release hängen
        uses: softprops/action-gh-release@v2
        with:
          files: device_saver.zip
